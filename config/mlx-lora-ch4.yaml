# Morningstar Hydra — CH-Fachdaten mit hoeherem LoRA-Rang (Runde 3)
#
# Runde 2 zeigte: mehr Daten helfen nicht mehr. Trotz 1800 Kantonsbeispielen bleiben
# SG/ZG falsch — das Faktum ist gelernt, wird bei ungesehener Frageform aber nicht
# abgerufen. Hypothese: Rang 16 (22.8M Parameter) reicht nicht fuer stabile
# Faktenkorrektur. Daher Rang 64. scale von 20 auf 10 gesenkt, weil MLX' scale ein
# absoluter Multiplikator ist — vervierfachte Parameterzahl bei gleichem scale waere
# deutlich aggressiver als der erprobte Betriebspunkt.
#
# Zweite Iteration nach dem Nullresultat vom 2026-07-25: Der generische Mix aus
# `hf-expert-mixture.json` hat HydraCH nicht bewegt, weil er praktisch keine
# Ueberschneidung mit dem Benchmark hatte (Rappen/Kanton/revDSG je 0x in 20074
# Beispielen). Dieser Lauf trainiert genau die fehlenden Faehigkeiten aus
# `scripts/build_ch_dataset.py`.
#
# Unterschiede zu config/mlx-lora-apertus8b.yaml:
#   * Datenformat {"prompt", "completion"} statt {"text"} — damit greift
#     mask_prompt. Entscheidend hier: bei privacy_policy stehen ~250 Prompt-Tokens
#     einer einwortigen Antwort gegenueber; ohne Maskierung waere fast das gesamte
#     Lernsignal blosses Nachplappern der Richtlinie.
#   * max_seq_length 288 statt 1536 — laengstes Beispiel misst 267 Tokens.
#   * batch 4 x grad_accum 4 = 16 Sequenzen pro Update (gleiche effektive
#     Batchgroesse, aber deutlich kleineres Tokenbudget pro Schritt).
#
# Datenherkunft ist gegen HydraCH geprueft: 0 exakte Treffer und 0 Near-Dups
# gegen dev (50 Faelle) UND hidden (200 Faelle), siehe
# scripts/check_ch_contamination.py.

model: "$HYDRA_MODELS_DIR/apertus-4b-instruct-mlx-int4"
train: true
data: "$HYDRA_TRAIN_DIR/data-ch4"

fine_tune_type: lora
optimizer: adamw
num_layers: -1

batch_size: 4
grad_accumulation_steps: 4
max_seq_length: 288
grad_checkpoint: true
mask_prompt: true       # Loss nur auf der Antwort

iters: 600             # ~1 Epoche ueber 6271 Beispiele
learning_rate: 1.0e-5

lr_schedule:
  name: cosine_decay
  warmup: 60
  warmup_init: 1.0e-7
  arguments: [1.0e-5, 600, 1.0e-6]

lora_parameters:
  keys:
    - "self_attn.q_proj"
    - "self_attn.k_proj"
    - "self_attn.v_proj"
    - "self_attn.o_proj"
    - "mlp.up_proj"
    - "mlp.down_proj"
  rank: 64
  scale: 10.0
  dropout: 0.05

adapter_path: "$HYDRA_TRAIN_DIR/adapters-ch4"
save_every: 200
steps_per_report: 20
steps_per_eval: 100
val_batches: 25
seed: 42
